name: Generate Blog from YouTube

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'Enter YouTube Video URL'
        required: true

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-genai

      - name: Generate Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_post.py "${{ github.event.inputs.youtube_url }}"

      - name: Commit and Push to Blog
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add _posts/
          git commit -m "Add new blog post from YouTube video [skip ci]" || exit 0
          git push
