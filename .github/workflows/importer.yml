name: Daily GitLab Bulk Importer

on:
  schedule:
    # Roz raat 12:00 AM UTC (5:30 AM IST) apne aap chalega
    - cron: '0 0 * * *'
  workflow_dispatch: # Manual 'Run workflow' button ke liye

jobs:
  import-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Importer Script
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TARGET: "gameinclassroom"  # <--- Agar kisi doosre account se import karna ho toh yahan uska naam badal sakte hain
          GITLAB_NAMESPACE: ${{ secrets.GITLAB_NAMESPACE }}
          GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
          IMPORT_DELAY: "2.0"
        run: python importer_cloud.py
